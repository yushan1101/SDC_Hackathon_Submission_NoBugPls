# Auto-deploy the backend to the server on every push to main (or by hand from the Actions tab).
# A GitHub-hosted runner sends the repo as a tar over SSH to deploy@dnns.olgtx.com. That key (secret DEPLOY_SSH_KEY) is
# locked on the server to one forced command, /opt/aiversepulse/deploy.sh, which swaps the code in, rebuilds with cached
# layers, waits for /healthz and rolls back if the new version is unhealthy. The server keeps its own .env, models and
# state; nothing secret comes from the repo, and the server needs no GitHub credentials.
name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:          # one deploy at a time; a newer push waits for the running one instead of racing it
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOST: dnns.olgtx.com
      # pinned host key (ssh-keyscan -t ed25519 dnns.olgtx.com): refuses to deploy anywhere else
      HOST_KEY: "dnns.olgtx.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHTMqFpBsrS6Zc8tEeO76V03RYxVIXFN4R0Z6Jm7QBhQ"
    steps:
      - uses: actions/checkout@v4

      - name: Load deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo "::error::secret DEPLOY_SSH_KEY is not set"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key   # a key piped through a Windows shell has CRLFs, which ssh can't load && chmod 600 ~/.ssh/deploy_key
          echo "$HOST_KEY" > ~/.ssh/known_hosts

      - name: Deploy (upload, rebuild, health check, rollback on failure)
        run: git archive --format=tar HEAD | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@"$HOST"

      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
