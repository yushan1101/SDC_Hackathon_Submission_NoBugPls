# Auto-deploy the backend to the AiversePulse server on every push to main (or by hand from the Actions tab).
# Runs on a self-hosted runner installed on the server itself (src/deploy/setup-runner.sh): the server is on a private
# network, so GitHub's cloud runners cannot reach it, and the runner only makes outbound connections to GitHub.
# Only code is synced; the server keeps its own .env, models and state in /opt/aiversepulse (never in the repo).
name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:          # one deploy at a time; a newer push waits for the running one instead of racing it
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, aiversepulse-server]
    timeout-minutes: 30
    env:
      APP_DIR: /opt/aiversepulse
    steps:
      - uses: actions/checkout@v4

      - name: Sync code to the server folder
        run: rsync -a --delete --exclude .git ./ "$APP_DIR/app/"

      - name: "Build and restart (cached layers, so a code-only change rebuilds in seconds)"
        working-directory: /opt/aiversepulse
        run: docker compose up -d --build

      - name: Wait until healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8600/healthz > /dev/null; then echo "healthy after ${i}x5s"; exit 0; fi
            sleep 5
          done
          echo "::error::app did not become healthy within 5 minutes"
          docker logs --tail 80 aiversepulse-api
          exit 1

      - name: Readiness report
        if: always()
        run: |
          curl -fsS http://127.0.0.1:8600/api/health || true
          docker ps --filter name=aiversepulse-api --format "{{.Names}} {{.Status}}"
