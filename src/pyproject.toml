[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiversepulse-enterprise"
version = "0.4.0"
description = "Multi-agent workforce reskilling decision support (employee + HR) with STF-KAN skill-demand backtests"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "fastapi>=0.115.6",
  "uvicorn>=0.31",  # CIDR ranges in --forwarded-allow-ips (.replit)
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",  # Postgres when AIVERSEPULSE_DATABASE_URL is set: several app nodes share one database (governance/db.py)
  "cryptography>=42",  # hiring plugin tokens encrypted at rest (governance/plugins.py)
  "pillow>=11.0",  # slider check images (governance/challenge.py)
  "python-multipart>=0.0.18",  # CVE-2024-53981 (DoS) fixed in 0.0.18
  "pypdf>=5.3",
  "pdfplumber>=0.11",
  "pikepdf>=9.0",
  "python-docx>=1.1",
  "pymupdf>=1.24",
  "langgraph>=1.2",
  "fastmcp>=4.1",
  "sentence-transformers>=6.1",
  "torch>=2.6",  # CVE-2025-32434: torch.load(weights_only=True) RCE below 2.6
  "pocket-tts>=4.0.1",
]

[project.optional-dependencies]
ai = ["chromadb>=1.5", "google-genai>=2.8"]
dev = ["pytest>=8.0", "streamlit>=1.40"]  # not shipped in the server image
train = ["xgboost>=3.0"]  # offline only (scripts/train_rising.py); the server reads exported JSON, no GPU needed

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "agents*", "forecasting*", "mcp_server*", "validation*", "governance*", "ui*", "tools*", "config*", "server*", "diagrams*"]

# CPU-only PyTorch is sufficient for serving and avoids downloading CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
