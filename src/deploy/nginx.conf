# Static frontend (web/). ${API_BASE} is substituted by the nginx image's envsubst templating.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; connect-src 'self' ${API_BASE} https://api.stripe.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  location = /config.js { default_type application/javascript; alias /tmp/ap-config.js; add_header Cache-Control no-cache; }
  location = /enterprise { try_files /enterprise.html =404; }
  location / { try_files $uri $uri/ =404; add_header Cache-Control no-cache; }
}
