# Primary (main server). Only what differs from Postgres defaults.
listen_addresses = '*'
max_connections = 100
shared_buffers = 256MB

# TLS only (pg_hba.conf allows hostssl lines only); certificate from the private CA in setup.md
ssl = on
ssl_cert_file = '/certs/server.crt'
ssl_key_file = '/certs/server.key'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = scram-sha-256

# replication to the LA standby. Semi-sync: a commit returns once the standby has flushed it.
# watchdog.sh owns synchronous_standby_names (ALTER SYSTEM): 'ANY 1 (standby_la)' while the standby streams,
# '' (async) while it is down. Starts as '' so first-time setup and a primary without a standby never wait.
wal_level = replica
max_wal_senders = 5
max_replication_slots = 5
max_slot_wal_keep_size = 4GB          # a standby gone for days cannot fill the disk; it then needs a fresh clone
synchronous_standby_names = ''
synchronous_commit = on               # per transaction, unimportant writes may use SET LOCAL synchronous_commit = local
hot_standby = on

log_min_duration_statement = 500ms
log_connections = on
log_replication_commands = on
